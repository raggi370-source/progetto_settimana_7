<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>SportsHub — Eventi sportivi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div id="div_prefe" class="container">
      <h1 class="fw-bold">SportsHub</h1>
      <p>Cerca una squadra, scopri le prossime partite e gli ultimi risultati</p>

      <input type="search" id="cerca" placeholder="Cerca una squadra...">
      <button id="cerca_button" type="button">Cerca</button>
    </div>
  </header>

  <main class="container">
    <h3>⭐ Le tue squadre preferite</h3>
    <div class="row">
 <div class="row g-2 my-3">
  <div class="col-6 col-sm">
    <button id="tutti" class="filtro btn btn-outline-primary w-100" data-sport="tutti" type="button">
      Tutti
    </button>
  </div>

  <div class="col-6 col-sm">
    <button id="basket" class="filtro btn btn-outline-primary w-100" data-sport="Basketball" type="button">
      Basket
    </button>
  </div>

  <div class="col-6 col-sm">
    <button id="calcio" class="filtro btn btn-outline-primary w-100" data-sport="Soccer" type="button">
      Calcio
    </button>
  </div>

  <div class="col-6 col-sm">
    <button id="football" class="filtro btn btn-outline-primary w-100" data-sport="American Football" type="button">
      Football
    </button>
  </div>
</div>

    <p class="para_prefe" hi>Non hai ancora salvato nessuna squadra, cercane una qui sopra e aggiungila ai preferiti</p>
    <div id="preferiti"></div>

    <section id="risultati-section">
      <h3>Squadre trovate</h3>
      <p id="ptrovate" hidden>inizia cercando una squadra qui sopra</p>
      <div id="squadre"></div>
    </section>




    <section id="dettagli-section" hidden>
      <p id="messaggio"></p>
      <h2 id="titolo-squadra" class="fw-bold"></h2>

      <div>
        <h3 class="fw-bold col-md-12 col-lg-6">Prossimi eventi</h3>
        <ul id="prossimi-eventi"></ul>
      </div>

      <div>
        <h3 class="fw-bold col-md-12 col-lg-6">Risultati precedenti</h3>
        <ul id="risultati"></ul>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
